[project]
name = "copilot-proxy"
version = "0.1.0"
description = "Python VLLM-compatible proxy for GitHub Copilot API"
authors = [{ name = "Copilot Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sse-starlette>=2.1.0",
    "typer>=0.12.0",
    "loguru>=0.7.0",
    "apscheduler>=3.10.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "portalocker>=2.8.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ipdb>=0.13.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-httpx>=0.36.0",
    "ruff>=0.8.0",
]

[project.scripts]
copilot-proxy = "copilot_proxy.cli.app:app"

[tool.uv]
managed = true

[tool.ruff]
line-length = 100
target-version = "py311"

# Ensure src directory is on Python path when using uv
[tool.setuptools]
py-modules = ["copilot_proxy"]
