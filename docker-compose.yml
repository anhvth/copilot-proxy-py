version: '3.8'

services:
  unified-proxy:
    build: .
    container_name: unified-proxy
    ports:
      - "4343:4343"
    environment:
      - PYTHONUNBUFFERED=1
      - COPILOT_DATA_DIR=/app/copilot-data
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - Z_AI_API_KEY=${Z_AI_API_KEY:-}
      - Z_AI_OPENAI_URL=${Z_AI_OPENAI_URL:-https://api.z.ai/api/coding/paas/v4}
      - ANTHROPIC_UPSTREAM=${ANTHROPIC_UPSTREAM:-https://api.z.ai/api/anthropic}
      - Z_AI_GLM_VERSION=${Z_AI_GLM_VERSION:-glm-4.5}
    volumes:
      - copilot-data:/app/copilot-data
      - ./.env:/app/.env:ro
      - ${HOME}/.cache/conversations_proxy_cache:/app/.cache
    restart: unless-stopped
    command: ["python", "run.py", "config.yaml"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4343/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  log-visualizer:
    build: .
    container_name: log-visualizer
    ports:
      - "4446:4446"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ${HOME}/.cache/conversations_proxy_cache:/app/.cache
    restart: unless-stopped
    command: ["python", "live_conversations.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4446/').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  copilot-data:
