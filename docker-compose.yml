version: '3.8'

services:
  copilot-proxy:
    build: .
    container_name: copilot-proxy
    ports:
      - "4242:4242"
    environment:
      - PYTHONUNBUFFERED=1
      - COPILOT_DATA_DIR=/app/copilot-data
    volumes:
      - copilot-data:/app/copilot-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4242/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  copilot-data:


